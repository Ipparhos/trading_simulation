[project]
name = "kraken-sim"
version = "0.1.0"
description = "Kraken Prop & Funded Scenario Simulation Engine"
readme = "architecture.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.92",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

